<section class="auth-wrap"><form class="auth-card" id="guideDetailsForm" data-goto="guide-verification.html"><h1>Create your guide profile</h1><p>Provide the basics, then continue to verification.</p><div class="form-grid"><div class="field"><label>Name</label><input required></div><div class="field"><label>Phone</label><input required type="tel"></div><div class="field"><label>City</label><select><option>Visakhapatnam</option><option>Vizianagaram</option><option>Bangalore</option><option>Goa</option></select></div><div class="field"><label>Years guiding</label><input required type="number" min="0"></div></div><div class="field"><label>City knowledge</label><input type="range" min="1" max="5" value="4"></div><div class="field"><label>Languages</label><input value="English, Telugu, Hindi"></div><button class="btn coral" type="submit">Continue to verification</button></form></section>
