<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virun — Create Account</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body data-nav="public" data-active="signup.html">
<a class="skip" href="#main">Skip to content</a>
<div id="scene" aria-hidden="true"></div>
<canvas id="weather" aria-hidden="true"></canvas>
<div id="nav"></div>
<main id="main">
<section class="auth-wrap"><form class="auth-card" id="createAccountForm"><h1>Create Account</h1><p>Enter your details and choose how you will use Virun. Nothing is sent or stored in this frontend demo.</p><button class="btn secondary" type="button" id="googleSignup" style="width:100%;margin-bottom:8px"><svg viewBox="0 0 24 24" style="width:18px;height:18px;flex:none" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.3h6.5c-.1 1.1-.8 2.7-2.4 3.8l-.1.1 3.5 2.7.1.1c2.2-2 3.9-5 3.9-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.1 0-5.8-2.1-6.8-5l-.1.1-3.7 2.9v.1C3.3 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-.1-.1-3.7-2.9-.1.1C.5 8.2 0 10 0 12s.5 3.8 1.3 5.4l3.9-3z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.3 0 3.3 2.7 1.3 6.6l3.9 3.1c1-2.9 3.7-5 6.8-5z"/></svg> Continue with Google</button><p class="hint" id="googleSignupHint" style="display:none;margin:0 0 18px;color:var(--muted)" role="status" aria-live="polite"></p><div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--muted)"><span style="height:1px;background:var(--line);flex:1"></span><span>or use your details</span><span style="height:1px;background:var(--line);flex:1"></span></div><div class="form-grid"><div class="field"><label for="accountName">Full name</label><input id="accountName" required autocomplete="name"></div><div class="field"><label for="accountEmail">Email</label><input id="accountEmail" required type="email" autocomplete="email"></div><div class="field"><label for="accountPhone">Phone</label><input id="accountPhone" required type="tel" autocomplete="tel"></div><div class="field"><label for="accountBirth">Birth date</label><input id="accountBirth" required type="date"></div><div class="field"><label for="accountAge">Age</label><input id="accountAge" required type="number" min="18" inputmode="numeric"></div><div class="field"><label for="accountTravels">Recent travels</label><input id="accountTravels" required placeholder="Cities or regions"></div><div class="field"><label for="accountCountry">Country</label><input id="accountCountry" required autocomplete="country-name"></div><div class="field"><label for="accountCity">State / city</label><input id="accountCity" required autocomplete="address-level1"></div><div class="field"><label for="accountPassword">Password</label><input id="accountPassword" required type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label for="accountConfirm">Confirm password</label><input id="accountConfirm" required type="password" minlength="8" autocomplete="new-password"></div></div><div class="field"><label for="accountRole">Account type</label><select id="accountRole" required><option value="tourist">Tourist</option><option value="guide">Guide</option></select></div><div id="accountError" class="error hidden" role="alert">Passwords must match.</div><button class="btn coral" type="submit" style="width:100%;white-space:nowrap">Create Account <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:18px;height:18px;flex:none"><path d="m9 18 6-6-6-6"/></svg></button><p style="margin-top:16px">Already have an account? <a href="signin.html" style="color:var(--primary);font-weight:700">Sign in</a></p></form></section>
</main>
<div id="mobileNav"></div>
<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/nav.js"></script>
<script src="js/bot.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
<script src="js/auth-backend.js"></script>
<script src="js/boot.js"></script>

</body>
</html>
