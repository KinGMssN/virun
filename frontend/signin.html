<section class="auth-wrap"><form class="auth-card" id="signinForm"><h1>Sign in</h1><p>Open the frontend demo with your account details.</p><div class="field"><label for="signinName">Your name</label><input id="signinName" required autocomplete="name" placeholder="Enter your name"></div><div class="field"><label for="signinEmail">Email</label><input id="signinEmail" required type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="signinPassword">Password</label><input id="signinPassword" required type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters"></div><button class="btn coral" type="submit" style="white-space:nowrap">Continue to dashboard <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:18px;height:18px;flex:none"><path d="m9 18 6-6-6-6"/></svg></button><div class="or-row"><span></span><em>or</em><span></span></div><button class="btn secondary" type="button" id="googleSignin" style="width:100%"><svg viewBox="0 0 24 24" style="width:18px;height:18px;flex:none"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.3h6.5c-.1 1.1-.8 2.7-2.4 3.8l-.1.1 3.5 2.7.1.1c2.2-2 3.9-5 3.9-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.1 0-5.8-2.1-6.8-5l-.1.1-3.7 2.9v.1C3.3 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-.1-.1-3.7-2.9-.1.1C.5 8.2 0 10 0 12s.5 3.8 1.3 5.4l3.9-3z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.3 0 3.3 2.7 1.3 6.6l3.9 3.1c1-2.9 3.7-5 6.8-5z"/></svg> Sign in with Google</button><p class="hint" id="googleHint" style="display:none;margin-top:10px;color:var(--muted)"></p><p style="margin-top:16px">New here? <a href="signup.html" style="color:var(--primary);font-weight:700">Create Account</a></p></form></section>
