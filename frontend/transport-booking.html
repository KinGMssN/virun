<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virun — Passenger details</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-nav="app" data-active="transport-booking.html">
<a class="skip" href="#main">Skip to content</a>
<div id="scene" aria-hidden="true"></div>
<canvas id="weather" aria-hidden="true"></canvas>
<div id="nav"></div>
<main id="main">
<section class="app-page"><div class="app-shell"><div class="page-head"><div><p class="eyebrow"><span data-fill="city"></span> trip</p><h1>Passenger details</h1><p id="bookingSub"></p></div></div><div class="grid two"><article class="card"><span class="tag accent">Selected mock option</span><h2 style="margin-top:14px" id="selName"></h2><div class="booking-summary" id="selSummary"></div></article><form class="card" data-goto="transport-review.html"><h2>Traveler information</h2><p style="margin-bottom:18px">Session-only fields for the frontend flow.</p><div class="field"><label for="passengerName">Lead passenger</label><input id="passengerName" required autocomplete="name"></div><div class="form-grid"><div class="field"><label for="passengerCount">Passengers</label><select id="passengerCount"><option>1</option><option>2</option><option>3</option><option>4</option></select></div><div class="field"><label for="seatPreference">Seat preference</label><select id="seatPreference"><option>No preference</option><option>Window</option><option>Aisle</option><option>Lower berth</option></select></div></div><button class="btn coral" type="submit">Review mock booking</button></form></div></div></section>
</main>
<div id="mobileNav"></div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/nav.js"></script>
<script src="js/bot.js"></script>

<script src="js/boot.js"></script>
<script>(function(){var V=window.Virun,D=window.VirunData;var j=V.store.getJSON('journey',{from:'Visakhapatnam',to:'Hyderabad',date:'',mode:'all'});var id=V.store.get('transportChoice','');var o=null;D.mockTransportOptions.forEach(function(x){if(x.id===id)o=x;});if(!o)o=D.mockTransportOptions[0];function fmtDate(){if(!j.date)return 'Choose a date';var d=new Date(j.date+'T12:00:00');return isNaN(d)?j.date:d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}document.getElementById('bookingSub').textContent='Continue with the selected mock '+o.kind.toLowerCase()+' option. Nothing is booked or sent.';document.getElementById('selName').textContent=o.name;document.getElementById('selSummary').innerHTML='<div class="list-row"><span>Route</span><strong>'+j.from+' \u2192 '+j.to+'</strong></div><div class="list-row"><span>Date</span><strong>'+fmtDate()+'</strong></div><div class="list-row"><span>Time</span><strong>'+o.depart+' \u2192 '+o.arrive+'</strong></div><div class="list-row"><span>Sample fare</span><strong>\u20b9'+o.fare.toLocaleString('en-IN')+'</strong></div>';var pn=document.getElementById('passengerName');var un=V.getUserName();if(un!=='Traveler')pn.value=un;})();</script>
</body>
</html>
