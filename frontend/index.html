function destinationSection(){var c=[['Kashmir',3,'Snow-covered landscapes and mountain routes'],['Goa',2,'Beaches, forts and heritage streets'],['Hyderabad',2,'Historic landmarks and food districts'],['Visakhapatnam',2,'Coastal views and city experiences'],['Mumbai',1,'Sea link, colonial icons and city lights'],['Delhi',1,'Monuments, avenues and old-city bazaars'],['Bengaluru',1,'Palaces, parks and garden-city streets']];return '<section class="section"><div class="section-head"><div><p class="eyebrow">Seven destination themes</p><h2>See the trip before you choose it</h2></div><p>Every city uses real repository photos and a distinct full-page weather treatment.</p></div><div class="grid four">'+c.map(function(x){return '<a class="card destination-card" href="#/choose-trip" data-city="'+x[0]+'"><img src="'+photo(x[0],x[1])+'" alt="'+x[2]+'" loading="lazy"><div class="caption"><span class="wx-badge" data-wx="'+x[0]+'"><span>--&deg;</span></span><h3>'+x[0]+'</h3><p>'+x[2]+'</p></div></a>'}).join('')+'</div></section>'}

function home(){return '<section class="hero"><div><p class="eyebrow">AI trip planning with verified local guidance</p><h1>Trips planned by AI, guided by verified locals.</h1><p>Build a practical route, choose online help or an offline companion, and keep trip payments protected until the journey is complete.</p><div class="action-row"><a class="btn coral" href="#/signup">Plan my trip '+icon('arrow')+'</a><a class="btn secondary" href="#/explore">Explore four destinations</a></div></div><div class="hero-visual"><div class="hero-photo"><img src="'+photo('Kashmir',2)+'" alt="Mountain landscape in Kashmir"></div><div class="floating-card top"><strong>One trip, one clear plan</strong><div class="mini-line"><span class="mini-icon">'+icon('plan')+'</span><span>AI route shaped around the destination</span></div></div><div class="floating-card bottom"><span class="verified">'+icon('shield')+' Verified guide flow</span><p style="margin-top:10px">Compare online and offline support before connecting.</p></div></div></section><section class="section"><div class="section-head"><div><p class="eyebrow">How it works</p><h2>From an idea to a guided trip</h2></div><p>Each step has a clear next action, with no dead buttons.</p></div><div class="grid three"><article class="card"><img class="step-art" src="'+imageAsset('ui-art/corner-compass.jpg')+'" alt=""><div class="step-no">01</div><h3>Choose your city</h3><p>Select one of four destinations and see the full interface adapt to that place.</p></article><article class="card"><img class="step-art" src="'+imageAsset('ui-art/corner-mountains.jpg')+'" alt=""><div class="step-no">02</div><h3>Review a three-day route</h3><p>See real place names arranged into a practical day-by-day structure.</p></article><article class="card"><img class="step-art" src="'+imageAsset('ui-art/corner-waves.jpg')+'" alt=""><div class="step-no">03</div><h3>Connect with a local</h3><p>Compare languages, expertise and support mode before booking.</p></article></div></section>'+destinationSection()+'<section class="section"><div class="section-head"><div><p class="eyebrow">People and proof</p><h2>Quick visual snapshots</h2></div></div><div class="grid three"><a class="data-box" href="#/reviews"><div class="skeleton"><i></i><i></i><i></i></div><strong>Reviews</strong></a><a class="data-box" href="#/about-guides"><div class="big-data">04</div><strong>About the guides</strong></a><a class="data-box" href="#/about-team"><div class="big-data">04</div><strong>About the team</strong></a></div></section><section class="section" id="team-preview"><div class="section-head"><div><p class="eyebrow">Four people, one build</p><h2>About the team</h2></div><a class="btn secondary" href="#/about-team">Open team page</a></div><div class="grid four">'+teamCards(true)+'</div></section>'+footer()}

function policy(t){return publicPage('Privacy Policy','<div class="grid two"><article class="card"><h2>Data this application handles</h2><p>When you use the corresponding feature, Virun processes your email and account name through Supabase Auth; trip destination, dates, stay length, budget and preferences for Groq itinerary generation; and station codes and travel date for RailRadar train searches. Generated plans are stored in the configured PostgreSQL database when available. A browser copy is kept in local storage for the Itinerary page.</p></article><article class="card"><h2>Service providers</h2><p>Supabase provides authentication and PostgreSQL hosting; Groq processes itinerary prompts; RailRadar handles live train searches; OpenStreetMap services are queried for nearby named places; Open-Meteo supplies weather data for the displayed destination. These providers receive only the inputs needed for the feature you request. Review their current privacy terms for their handling and retention.</p></article><article class="card"><h2>Cookies and browser storage</h2><p>Virun does not currently run advertising or analytics cookies. Supabase Auth uses browser storage to maintain the sign-in session, and Virun uses local storage for cookie preferences and locally displayed itineraries. The Cookie Notice explains these controls and lets you change your optional analytics preference.</p></article><article class="card"><h2>Security, retention and your choices</h2><p>Use a private device for sign-in. Do not submit payment card data or sensitive identity documents; booking and verification are not connected. Database retention and account deletion controls are not yet available in this application. Contact the operator of this deployment for account or data requests; the operator must publish a working support contact before public launch.</p></article><article class="card"><h2>Policy scope</h2><p>This notice describes the application features currently present and is not legal advice. The operator must review and adapt it for the countries served, actual database retention, and provider agreements before collecting real user accounts.</p></article></div>')}
function cookiesPage(){return publicPage('Cookie Notice and consent','<div class="grid two"><article class="card"><h2>What Virun uses</h2><p>No advertising or analytics cookies are currently active. Supabase Auth stores a session in browser storage so your login can persist. Virun also stores your consent selection and generated itinerary copies in local storage. These are browser storage entries, not tracking cookies.</p></article><article class="card"><h2>Required storage</h2><p>Authentication storage is needed for sign-in and OAuth recovery. Consent preferences remember your choice. Turning off browser storage may prevent these features from working. You can remove Virun data from your browser settings, but doing so signs you out and removes local itinerary copies.</p></article><article class="card"><h2>Optional analytics preference</h2><p>Virun has no analytics tools enabled at this time. Choosing “Accept all” records your current optional preference but does not activate or authorize a future tracker. If analytics are introduced, the notice and choices must be updated. You can change your choice any time with Cookie settings.</p></article><article class="card"><h2>Third-party services</h2><p>When you sign in or request travel features, the selected service may process data as described in the <a href="#/privacy">Privacy Policy</a>. Cookie choices do not opt you out of a provider call needed for a feature you request.</p></article></div><div class="action-row" style="margin-top:20px"><button class="btn secondary" type="button" id="cookieSettingsPage">Change cookie settings</button><button class="btn" type="button" data-consent-choice="essential">Use essential only</button><button class="btn coral" type="button" data-consent-choice="all">Accept all</button></div>')}
function termsPage(){return publicPage('Terms and Conditions','<div class="grid two"><article class="card"><h2>Planning information</h2><p>Generated travel ideas and OpenStreetMap place listings are informational. Verify local conditions, accessibility, opening hours and safety before travel. Timetables can change.</p></article><article class="card"><h2>Bookings and payments</h2><p>Virun currently does not sell tickets, reserve a guide, or process payments. Do not treat a plan or train result as a confirmed reservation.</p></article><article class="card"><h2>Accounts and acceptable use</h2><p>Keep your sign-in details private and use the application lawfully. Account roles and access controls for guide, government and administrative areas are not implemented.</p></article><article class="card"><h2>Availability and support</h2><p>Third-party APIs may be unavailable or return incomplete data. The operator of this deployment should publish a support channel and review these terms before public launch.</p></article></div>')}
function signin(){return '<section class="auth-wrap"><form class="auth-card" id="signinForm"><h1>Sign in</h1><p>Your account is managed securely by Supabase Auth.</p><div class="field"><label for="signinEmail">Email</label><input id="signinEmail" required type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="signinPassword">Password</label><input id="signinPassword" required type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters"></div><p class="hint" id="signinStatus" role="status" aria-live="polite"></p><button class="btn coral" type="submit">Sign in and continue '+icon('arrow')+'</button><div class="or-row"><span></span><em>or</em><span></span></div><button class="btn secondary" type="button" id="googleSignin" style="width:100%">Sign in with Google</button><p class="hint" id="googleHint" style="display:none;margin-top:10px;color:var(--muted)" role="status" aria-live="polite"></p><p style="margin-top:16px">New here? <a href="#/signup" style="color:var(--primary);font-weight:700">Create an account</a></p><p class="footer-note">By signing in, you acknowledge our <a href="#/privacy">Privacy Policy</a> and <a href="#/cookies">Cookie Notice</a>.</p></form></section>'}
function authFlight(){return '<section class="plane-stage"><div class="plane-wrap"><div class="plane-line"><span class="plane">'+icon('plane')+'</span></div><h1>Preparing your '+city+' trip view</h1><p>Applying the destination theme across the whole experience.</p></div></section>'}
function signup(){return '<section class="auth-wrap"><form class="auth-card" id="createAccountForm"><h1>Create your account</h1><p>Only the details needed to create and protect your account are requested.</p><div class="field"><label for="accountRole">I am joining as</label><select id="accountRole" required><option value="tourist">Tourist</option><option value="guide">Guide</option></select></div><button class="btn secondary" type="button" id="googleSignup" style="width:100%;margin-bottom:8px">Continue with Google</button><p class="hint" id="googleSignupHint" style="display:none;margin:0 0 18px;color:var(--muted)" role="status" aria-live="polite"></p><div class="or-row"><span></span><em>or use email</em><span></span></div><div class="field"><label for="accountName">Full name</label><input id="accountName" required maxlength="120" autocomplete="name"></div><div class="field"><label for="accountEmail">Email</label><input id="accountEmail" required type="email" autocomplete="email"></div><div class="field"><label for="accountPhone">Phone (optional)</label><input id="accountPhone" type="tel" autocomplete="tel"></div><div class="field"><label for="accountPassword">Password</label><input id="accountPassword" required type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label for="accountConfirm">Confirm password</label><input id="accountConfirm" required type="password" minlength="8" autocomplete="new-password"></div><label class="consent-check"><input id="signupPrivacyConsent" type="checkbox" required><span>I have read the <a href="#/privacy">Privacy Policy</a> and agree to the processing needed to provide this account.</span></label><div id="accountError" class="error hidden" role="alert">Passwords must match.</div><p class="hint" id="signupStatus" role="status" aria-live="polite"></p><button class="btn coral" type="submit" style="width:100%">Create account '+icon('arrow')+'</button><p style="margin-top:16px">Already registered? <a href="#/signin" style="color:var(--primary);font-weight:700">Sign in</a></p></form></section>'}
function roleSelect(){return '<section class="auth-wrap"><div class="auth-card"><h1>Choose your account type</h1><p>Google sign-in is a frontend preview. Choose a role to continue without connecting an account.</p><a class="card flat role-card" href="#/journey-search"><strong>Tourist</strong><span>Plan a trip and connect with a guide</span></a><a class="card flat role-card" href="#/guide-details"><strong>Guide</strong><span>Create a guide profile and enter verification</span></a><a class="card flat role-card" href="#/gov-signin"><strong>Government</strong><span>Open the tourism data dashboard</span></a><a class="card flat role-card" href="#/admin-dashboard"><strong>Admin</strong><span>Open KYC, booking and dispute operations</span></a><a class="btn secondary" href="#/signup">Back to Create Account</a></div></section>'}
function touristDetails(){return '<section class="auth-wrap"><form class="auth-card" action="#/journey-search"><h1>Tell us the trip basics</h1><p>These fields are for this session only and are not stored.</p><div class="form-grid"><div class="field"><label>Name</label><input id="touristName" required></div><div class="field"><label>Email</label><input required type="email"></div><div class="field"><label>Phone</label><input required type="tel"></div><div class="field"><label>Age</label><input required type="number" min="18"></div><div class="field"><label>Birth date</label><input required type="date"></div><div class="field"><label>Recent travels</label><input placeholder="Cities or regions"></div></div><button class="btn coral" type="submit">Continue to tourist dashboard '+icon('arrow')+'</button></form></section>'}
function chooseTrip(){var p={Kashmir:4,Goa:3,Hyderabad:4,Visakhapatnam:3,Mumbai:1,Delhi:1,Bengaluru:1};return '<section class="auth-wrap"><div class="auth-card"><h1>What is your next trip?</h1><p>Choose a city to set the full-page photo, accent and weather treatment.</p><div class="choice-grid">'+Object.keys(p).map(function(c){return '<a class="card choice" href="#/tourist-dashboard" data-city="'+c+'"><img src="'+photo(c,p[c])+'" alt="View of '+c+'"><span>'+c+'</span></a>'}).join('')+'</div></div></section>'}
function guideDetails(){return '<section class="auth-wrap"><form class="auth-card" id="guideProfileForm"><h1>Create your guide profile</h1><p>Your details are saved to your guide account and can be edited later.</p><div class="form-grid"><div class="field"><label for="guideName">Full name</label><input id="guideName" required maxlength="120" autocomplete="name" value="'+esc(userName==='Traveler'?'':userName)+'"></div><div class="field"><label for="guidePhone">Phone</label><input id="guidePhone" required type="tel" minlength="7" maxlength="32" autocomplete="tel"></div><div class="field"><label for="guideCity">City you guide in</label><input id="guideCity" required maxlength="120" autocomplete="address-level2"></div><div class="field"><label for="guideYears">Years guiding</label><input id="guideYears" required type="number" min="0" max="60" value="0"></div></div><div class="field"><label for="guideKnowledge">City knowledge (1 to 5)</label><input id="guideKnowledge" type="range" min="1" max="5" value="4"></div><div class="field"><label for="guideLanguages">Languages you speak</label><input id="guideLanguages" required maxlength="400" placeholder="English, Telugu"></div><div class="field"><label for="guideBiography">About you (optional)</label><textarea id="guideBiography" maxlength="2000" placeholder="Your experience and the tours you offer"></textarea></div><p id="guideProfileStatus" class="hint" role="status" aria-live="polite"></p><button class="btn coral" type="submit">Save guide profile</button></form></section>'}
function verification(){return '<section class="auth-wrap"><div class="auth-card"><h1>Guide verification</h1><p>Complete identity and city-knowledge checks before accepting bookings.</p><div class="list"><div class="list-row"><div><h3>DigiLocker identity check</h3><p>Mock integration for this frontend demo</p></div><a class="btn" href="#/guide-dashboard">Verify with DigiLocker</a></div><div class="list-row"><div><h3>ID document</h3><p>Upload control is shown as a visual mock</p></div><a class="btn secondary" href="#/guide-dashboard">Continue with ID upload</a></div></div><div class="notice" style="margin-top:18px"><strong>Status: Pending review</strong><br>Approval is not simulated in this frontend.</div></div></section>'}
function govSignin(){return '<section class="auth-wrap"><div class="auth-card"><h1>Government access unavailable</h1><p>Government authentication is not connected. This screen does not accept credentials.</p></div></section>'}
function stationInput(id,label,value){return '<div class="field"><label for="'+id+'">'+label+' station code</label><input id="'+id+'" required minlength=2 maxlength=6 pattern="[A-Za-z0-9]{2,6}" autocomplete="off" placeholder="e.g. VSKP" value="'+esc(value)+'"><small>Use the station code from the railway station or RailRadar.</small></div>'}
function formatJourneyDate(){if(!journey.date)return 'Choose a date';var d=new Date(journey.date+'T12:00:00');return isNaN(d)?esc(journey.date):d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function destinationPlaceName(code){var names={VSKP:'Visakhapatnam',SC:'Secunderabad, Hyderabad',HYB:'Hyderabad',NDLS:'New Delhi',NZM:'New Delhi',CSMT:'Mumbai',SBC:'Bengaluru',MAO:'Goa',MAS:'Chennai',HWH:'Kolkata',JP:'Jaipur',AGC:'Agra',BPL:'Bhopal',PUNE:'Pune',ADI:'Ahmedabad'};return names[String(code||'').trim().toUpperCase()]||String(code||'').trim()}function journeyStep(active){return '<div class="notice"><strong>Part '+active+' of 3: '+['Going','Staying','Returning'][active-1]+'</strong><p>Going - live train search &nbsp; | &nbsp; Staying - Groq itinerary &nbsp; | &nbsp; Returning - live train search</p></div>'}
async function railSearch(from,to,date){var params=new URLSearchParams({from_station:from,to_station:to,travel_date:date});var response=await fetch('/api/rail/trains?'+params.toString(),{headers:{'Accept':'application/json'}});var body=await response.json().catch(function(){return {}});if(!response.ok){var detail=body.detail;if(detail&&typeof detail==='object')detail=detail.message||detail.code;throw new Error(detail||'Live train search is unavailable.')}return Array.isArray(body.trains)?body.trains:[]}
function trainCards(trains,from,to){if(!trains.length)return '<div class="empty"><div><h2>No train results</h2><p>RailRadar returned no trains for these stations and date.</p></div></div>';return '<div class="grid two">'+trains.map(function(t){var duration=Number.isFinite(t.duration_minutes)?Math.floor(t.duration_minutes/60)+'h '+(t.duration_minutes%60)+'m':'Not provided';return '<article class="card transport-card"><span class="tag accent">RailRadar timetable</span><h2 style="margin-top:12px">'+esc(t.number)+' - '+esc(t.name)+'</h2><p>'+esc(t.train_type||'Train')+'</p><div class="transport-time"><div><strong>'+esc(t.departure||'Not provided')+'</strong><small style="display:block;color:var(--muted)">'+esc(from.toUpperCase())+'</small></div><span class="route-line" aria-hidden="true"></span><div><strong>'+esc(t.arrival||'Not provided')+'</strong><small style="display:block;color:var(--muted)">'+esc(to.toUpperCase())+'</small></div></div><div class="transport-meta"><div><small>Duration</small><strong>'+duration+'</strong></div><div><small>Delay</small><strong>'+(Number.isFinite(t.delay_minutes)?esc(t.delay_minutes)+' min':'Unavailable')+'</strong></div><div><small>Fare / seats</small><strong>Unavailable</strong></div></div><p>'+esc(t.live_status||'Live status unavailable')+'</p></article>'}).join('')+'</div>'}

      else map.fitBounds(bounds.pad(0.15),{maxZoom:14});
      container.dataset.mapState='ready';
      requestAnimationFrame(function(){if(container.isConnected)map.invalidateSize()});
    }).catch(function(){
      if(container.isConnected){
        container.dataset.mapState='error';
        container.textContent='Interactive map could not load. Use the verified place links below.';
      }
    });
  }
  function insertMap(list,places){
    var container=list.parentNode.querySelector(':scope > .leaflet-place-map');
    if(!container){
      container=document.createElement('div');
      container.className='leaflet-place-map';
      container.setAttribute('role','region');
      container.setAttribute('aria-label','Interactive map of verified nearby places');
      container.style.cssText='height:360px;min-height:300px;margin:16px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;color:var(--muted);text-align:center;padding:12px';
      list.parentNode.insertBefore(container,list);
    }
    mapFor(container,places);
  }
  function placesFromList(list){
    return Array.from(list.querySelectorAll('a.list-row')).map(function(link){
      var coordinates;
      try{
        var url=new URL(link.href);
        var latitude=url.searchParams.get('mlat'),longitude=url.searchParams.get('mlon');
        if(latitude===null||longitude===null)return null;
        coordinates={latitude:Number(latitude),longitude:Number(longitude)};
      }catch(_){return null}
      var name=link.querySelector('h3');
      var category=link.querySelector('p');
      return {
        name:name?name.textContent.trim():'',
        category:category?category.textContent.trim():'',
        latitude:coordinates.latitude,
        longitude:coordinates.longitude,
        map_url:link.href
      };
    }).filter(function(place){
      return place&&place.name&&Number.isFinite(place.latitude)&&Number.isFinite(place.longitude)&&
        place.latitude>=-90&&place.latitude<=90&&place.longitude>=-180&&place.longitude<=180;
    });
  }
  function mountPlaceMaps(){
    var currentRoute=location.hash.replace(/^#\//,'').split('?')[0];
    if(currentRoute==='stay-plan'){
      var section=Array.from(document.querySelectorAll('#main section.card')).find(function(card){
        var heading=card.querySelector('h2');
        return heading&&heading.textContent.indexOf('Real places near ')===0;
      });
      var list=section&&section.querySelector('.grid.two');
      var places=list&&placesFromList(list);
      if(list&&places.length)insertMap(list,places);
    }else if(currentRoute==='itinerary'){
      document.querySelectorAll('#main article.card').forEach(function(card){
        var list=card.querySelector('.list');
        var places=list&&placesFromList(list);
        if(list&&places.length)insertMap(list,places);
      });
    }
  }
  var main=document.getElementById('main');
  if(main)new MutationObserver(mountPlaceMaps).observe(main,{childList:true,subtree:true});
  window.addEventListener('hashchange',mountPlaceMaps);
  mountPlaceMaps();
})();
</script></body></html>
