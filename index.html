    @media(max-width:640px){.data-board{grid-template-columns:1fr}.data-box.wide,.data-box.narrow,.data-box.third{grid-column:auto}.journey-form{grid-template-columns:1fr}.swap-route{justify-self:center;transform:rotate(90deg)}.mock-banner{flex-direction:column}.transport-meta{grid-template-columns:1fr}.transport-time{grid-template-columns:1fr auto 1fr}.nav-inner{width:calc(100% - 24px)}.public-nav .nav-inner{flex-wrap:wrap;padding:8px 0}.public-nav .nav-inner>.nav-links:first-child .nav-link:nth-child(n+4){display:none}.public-nav .nav-inner>.nav-links:last-child{margin-left:auto}.hero{width:calc(100% - 28px);padding-top:44px}.hero h1{font-size:2.85rem}.hero-visual{min-height:360px}.hero-photo{inset:10px 22px 30px 0}.floating-card{padding:13px;max-width:210px}.floating-card.bottom{right:82px}.grid.two,.grid.three,.grid.four,.form-grid,.choice-grid{grid-template-columns:1fr}.section,.page{width:calc(100% - 28px)}.section{padding:50px 0}.section-head{align-items:flex-start;flex-direction:column}.destination-card{min-height:320px}.app-page{width:calc(100% - 20px);padding-top:14px}.app-shell{border-radius:14px;padding:16px}.app-top-inner{width:calc(100% - 20px)}.trip-switch label{font-size:.74rem}.trip-switch select{max-width:178px;padding:8px}.list-row{align-items:flex-start;flex-direction:column}.list-row .btn{width:100%}.guide-prices{grid-template-columns:1fr}.bar-row{grid-template-columns:100px 1fr 40px;gap:8px}.table-head{display:none}.table-row{grid-template-columns:1fr 1fr}.table-row>*:before{content:attr(data-label);display:block;color:var(--muted);font-size:.7rem;font-weight:800}.feed{columns:1}.action-row .btn{flex:1}.auth-card{padding:22px}.bot{right:auto;left:14px}.bot-panel{right:10px;width:calc(100vw - 20px)}.public-footer{padding-bottom:110px}}

  <style id="light-blue-theme">

    .plane-stage{background:linear-gradient(145deg,#EFF6FF,#DBEAFE);color:var(--ink)}

<a class="skip" href="#main">Skip to content</a><div id="scene" aria-hidden="true"></div><canvas id="weather" aria-hidden="true"></canvas><div id="nav"></div><main id="main"></main><div id="mobileNav"></div>
<button id="bot" class="bot" aria-label="Open Virun travel chat"><span class="bot-bob"><img id="botFace" class="bot-face" alt=""></span></button><aside id="botPanel" class="bot-panel" aria-label="Virun travel chat"><div class="bot-panel-head"><img id="botAvatar" class="bot-panel-avatar" alt="Virun mascot"><div><h2>Ask Virun</h2><p id="botStatus">Choose a quick question.</p></div></div><div class="chips"><button class="chip" data-reply="Choose a city in Explore, then use the trip planner to shape a three-day route.">What do you want to explore?</button><button class="chip" data-reply="Start with your city, preferred pace and must-see places. The itinerary page shows the three-day structure.">Plan a 3-day trip</button><button class="chip" data-reply="Open Guides to compare languages, city expertise, online help and offline companion pricing.">Find a guide</button><button class="chip" data-reply="Pack for the weather and planned activities. Keep identity documents, water and a power bank easy to reach.">What should I pack?</button></div><form id="botTripForm" class="field" style="margin-top:14px"><label for="botTripMessage">Describe a trip</label><textarea id="botTripMessage" required maxlength="1000" placeholder="From Visakhapatnam to Hyderabad tomorrow, arrive before 9 AM"></textarea><button class="btn small" type="submit">Parse and check routes</button></form><div id="botReply" class="bot-reply" aria-live="polite"></div></aside><div class="cursor-dot" id="cursorDot" aria-hidden="true"></div><div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>
<script>
(function(){'use strict';
var city='Hyderabad',userName='Traveler',flightTimer=null,particles=[],raf=null;
var imageRoot=location.pathname.indexOf('/spaces/v2/')!==-1?'assets/resources/images/':'resources/images/';
function imageAsset(path){return imageRoot+path}
document.documentElement.style.setProperty('--auth-image','url("'+imageAsset('hyderabad/photos/hyderabad_02.jpg')+'")');
document.documentElement.style.setProperty('--map-image','url("'+imageAsset('hyderabad/photos/hyderabad_03.jpg')+'")');
var journey={from:'Visakhapatnam',to:'Hyderabad',date:'',mode:'all'},transportChoice=null;
var plannerOptionsData=[],railradarError='';
var cityData={Kashmir:{key:'kashmir',accent:'#7DD3FC',image:imageAsset('kashmir/photos/kashmir_01.jpg')},Goa:{key:'goa',accent:'#2DD4BF',image:imageAsset('goa/photos/goa_01.jpg')},Hyderabad:{key:'hyderabad',accent:'#F59E0B',image:imageAsset('hyderabad/photos/hyderabad_01.jpg')},Visakhapatnam:{key:'visakhapatnam',accent:'#38BDF8',image:imageAsset('visakhapatnam/photos/visakhapatnam_01.jpg')}};
var guides=[{name:'Dhanunjay',city:'Visakhapatnam',expertise:'High',online:100,offline:200},{name:'Mohit',city:'Vizianagaram',expertise:'Medium-High',online:150,offline:200},{name:'Deepti',city:'Bangalore',expertise:'Medium',online:100,offline:500},{name:'Jashwant',city:'Goa',expertise:'High',online:200,offline:600}];
var team=[{name:'Mohit Sai Satyanarayana',college:'MVGR College',year:'Second year'},{name:'Dhanunjay Reddy',college:'Andhra University',year:'Second year'},{name:'Leela Prasad',college:'Vignan Engineering College',year:'Second year'},{name:'Gudiya Deppu',college:'MVGR College of Engineering',year:''}];
function teamCards(linked){return team.map(function(member,i){var body='<div class="initial-tile">'+String(i+1).padStart(2,'0')+'</div><h3 style="margin-top:22px">'+member.name+'</h3><p>'+member.college+'</p>'+(member.year?'<span class="tag" style="margin-top:16px">'+member.year+'</span>':'');return linked?'<a class="card" href="#/about-team" aria-label="View '+member.name+' on the team page">'+body+'</a>':'<article class="card">'+body+'</article>'}).join('')}
function photo(c,n){var k=c.toLowerCase();return imageAsset(k+'/photos/'+k+'_'+String(n).padStart(2,'0')+'.jpg')}
function icon(n){var p={home:'<path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z"/>',plan:'<path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5"/>',guide:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3.5-8 8-8s8 3 8 8"/>',feed:'<rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3.5-8 8-8s8 3 8 8"/>',arrow:'<path d="m9 18 6-6-6-6"/>',shield:'<path d="M12 3 4 6v5c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6z"/><path d="m9 12 2 2 4-5"/>',plane:'<path d="m2 16 20-9-7 13-3-6-10 2zM12 14 9 9"/>'};return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(p[n]||p.arrow)+'</svg>'}
function avatar(){return '<div class="avatar" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"><circle cx="32" cy="22" r="12"/><path d="M10 58c2-14 10-22 22-22s20 8 22 22"/></svg></div>'}
function publicNav(){return '<header class="public-nav"><nav class="nav-inner" aria-label="Primary"><div class="nav-links"><a class="nav-link" href="#/home">Home</a><a class="nav-link" href="#/pricing">Pricing</a><a class="nav-link" href="#/explore">Explore</a><a class="nav-link" href="#/reviews">Reviews</a><a class="nav-link" href="#/about-guides">Guides</a><a class="nav-link" href="#/about-team">Team</a></div><div class="nav-links"><a class="nav-link" href="#/signin">Sign In</a><a class="btn coral small" href="#/signup">Create Account</a></div></nav></header>'}
function appNav(){var o=Object.keys(cityData).map(function(c){return '<option'+(c===city?' selected':'')+'>'+c+'</option>'}).join('');return '<header class="app-top"><div class="app-top-inner"><div class="trip-switch"><label for="citySelect">Choose My Trip</label><select id="citySelect">'+o+'</select></div><nav class="desktop-links"><a class="nav-link" href="#/tourist-dashboard">Dashboard</a><a class="nav-link" href="#/journey-search">Train &amp; Bus</a><a class="nav-link" href="#/itinerary">Itinerary</a><a class="nav-link" href="#/guides">Guides</a><a class="nav-link" href="#/discovery">Discover</a><a class="nav-link" href="#/tourist-profile">Profile</a></nav><a class="btn small" href="#/active-trip">Active trip</a></div></header>'}
function mobileNav(r){var l=[['tourist-dashboard','home','Home'],['journey-search','plan','Travel'],['guides','guide','Guides'],['discovery','feed','Discover'],['tourist-profile','profile','Profile']];return '<nav class="bottom-nav" aria-label="Mobile app">'+l.map(function(x){return '<a class="'+(r===x[0]?'active':'')+'" href="#/'+x[0]+'">'+icon(x[1])+'<span>'+x[2]+'</span></a>'}).join('')+'</nav>'}
function footer(){return '<footer class="public-footer"><div class="footer-inner"><div><strong>Plan with context. Travel with local knowledge.</strong><div class="footer-note">Photos: Wikimedia Commons. Map data: OpenStreetMap contributors.</div></div><div class="footer-links"><a href="#/pricing">Pricing</a><a href="#/explore">Explore</a><a href="#/reviews">Reviews</a><a href="#/about-guides">About Guides</a><a href="#/about-team">About Team</a><a href="#/privacy">Privacy Policy</a><a href="#/terms">Terms and Conditions</a></div></div></footer>'}
function destinationSection(){var c=[['Kashmir',3,'Snow-covered landscapes and mountain routes'],['Goa',2,'Beaches, forts and heritage streets'],['Hyderabad',2,'Historic landmarks and food districts'],['Visakhapatnam',2,'Coastal views and city experiences']];return '<section class="section"><div class="section-head"><div><p class="eyebrow">Four destination themes</p><h2>See the trip before you choose it</h2></div><p>Destination photos and a city-themed visual background are shown; no weather forecast is provided.</p></div><div class="grid four">'+c.map(function(x){return '<a class="card destination-card" href="#/choose-trip" data-city="'+x[0]+'"><img src="'+photo(x[0],x[1])+'" alt="'+x[2]+'"><div class="caption"><h3>'+x[0]+'</h3><p>'+x[2]+'</p></div></a>'}).join('')+'</div></section>'}
function pricingGrid(){var p=[['Single Trip','Rs 100','One trip'],['Two Trips','Rs 200','Two trips'],['Three Trips','Rs 300','Three trips'],['Frequent Traveler','Rs 500','More frequent planning']];return '<div class="grid four">'+p.map(function(x,i){return '<article class="card price-card">'+(i===2?'<span class="tag accent">Most picked</span>':'<span class="tag">Sample pricing</span>')+'<h3 style="margin-top:18px">'+x[0]+'</h3><div class="price">'+x[1]+' <small>/ plan</small></div><p>'+x[2]+', itinerary tools and guide discovery.</p><a class="btn '+(i===2?'coral':'')+'" href="#/signup">Choose plan</a></article>'}).join('')+'</div>'}
function home(){return '<section class="hero"><div><p class="eyebrow">Trip planning preview · Sample guide profiles</p><h1>Plan a route and review sample local guides.</h1><p>Search a route and explore sample guide profiles. This preview does not create bookings, payments or verified guide connections.</p><div class="action-row"><a class="btn coral" href="#/signup">Plan my trip '+icon('arrow')+'</a><a class="btn secondary" href="#/explore">Explore four destinations</a></div></div><div class="hero-visual"><div class="hero-photo"><img src="'+photo('Kashmir',2)+'" alt="Mountain landscape in Kashmir"></div><div class="floating-card top"><strong>One trip, one clear plan</strong><div class="mini-line"><span class="mini-icon">'+icon('plan')+'</span><span>AI route shaped around the destination</span></div></div><div class="floating-card bottom"><span class="verified">'+icon('shield')+' Guide profile preview</span><p style="margin-top:10px">Sample profiles show online and offline support options.</p></div></div></section><section class="section"><div class="section-head"><div><p class="eyebrow">How it works</p><h2>From an idea to a guided trip</h2></div><p>Each step has a clear next action, with no dead buttons.</p></div><div class="grid three"><article class="card"><img class="step-art" src="'+imageAsset('ui-art/corner-compass.jpg')+'" alt=""><div class="step-no">01</div><h3>Choose your city</h3><p>Select one of four destinations and see the full interface adapt to that place.</p></article><article class="card"><img class="step-art" src="'+imageAsset('ui-art/corner-mountains.jpg')+'" alt=""><div class="step-no">02</div><h3>Review a three-day route</h3><p>See real place names arranged into a practical day-by-day structure.</p></article><article class="card"><img class="step-art" src="'+imageAsset('ui-art/corner-waves.jpg')+'" alt=""><div class="step-no">03</div><h3>Review guide profiles</h3><p>Review sample language, expertise and support details.</p></article></div></section>'+destinationSection()+'<section class="section"><div class="section-head"><div><p class="eyebrow">People and proof</p><h2>Quick visual snapshots</h2></div></div><div class="grid three"><a class="data-box" href="#/reviews"><div class="skeleton"><i></i><i></i><i></i></div><strong>Reviews</strong></a><a class="data-box" href="#/about-guides"><div class="big-data">04</div><strong>About the guides</strong></a><a class="data-box" href="#/about-team"><div class="big-data">04</div><strong>About the team</strong></a></div></section><section class="section" id="team-preview"><div class="section-head"><div><p class="eyebrow">Four people, one build</p><h2>About the team</h2></div><a class="btn secondary" href="#/about-team">Open team page</a></div><div class="grid four">'+teamCards(true)+'</div></section>'+footer()}
function publicPage(t,b){return '<section class="page public-page"><div class="page-head"><div><p class="eyebrow">Virun</p><h1>'+t+'</h1></div></div>'+b+'</section>'+footer()}
function pricing(){return publicPage('Pricing that follows the number of trips','<p class="notice" style="margin-bottom:22px">These values are sample pricing for the frontend demo and can be edited before launch.</p>'+pricingGrid())}
function explore(){return publicPage('Explore the four launch destinations',destinationSection())}
function reviewsPage(){return publicPage('Reviews','<div class="data-board"><article class="data-box wide"><div class="skeleton" aria-label="Sample review layout"><i></i><i></i><i></i></div><div><span class="tag accent">Goa</span> <span class="tag">3 days</span></div></article><article class="data-box narrow"><span class="tag">Sample data</span><div class="big-data">04</div><div class="skeleton"><i></i><i></i></div></article><article class="data-box third"><div class="initial-tile">K</div><div class="skeleton"><i></i><i></i><i></i></div></article><article class="data-box third"><div class="initial-tile">H</div><div class="skeleton"><i></i><i></i><i></i></div></article><article class="data-box third"><div class="initial-tile">V</div><div class="skeleton"><i></i><i></i><i></i></div></article></div>')}
function aboutGuides(){return publicPage('About the guides','<div class="data-board">'+guides.map(function(g,i){return '<article class="data-box '+(i<2?'wide':'narrow')+'"><div class="guide-top">'+avatar()+'<div><h2>'+g.name+'</h2><span class="tag">'+g.city+'</span></div></div><div class="guide-prices"><div class="price-line"><small>Online</small><strong>Rs '+g.online+'</strong></div><div class="price-line"><small>Offline</small><strong>Rs '+g.offline+'</strong></div></div></article>'}).join('')+'</div>')}
function aboutTeam(){return publicPage('About the team','<div class="grid four">'+teamCards(false)+'</div>')}
function policy(t){var p=t==='Privacy Policy';return publicPage(t,'<div class=\"notice\"><strong>Prototype notice — not a final legal policy.</strong><p>Route searches send trip details to the Virun backend. Natural-language parsing sends the request text to Groq for extraction. This prototype has no real accounts, bookings, payments or document verification. Do not submit sensitive information. Production data handling and retention terms require review before launch.</p></div><div class=\"card\" style=\"margin-top:20px\"><h2>Service limits</h2><p>Bundled bus routes and guide details are demo content. RailRadar train schedules are informational and do not confirm fares, seats or bookings. Check provider information before travel.</p></div>')}
function signin(){return shell('Sign-in preview','Authentication is not connected. Do not enter account credentials.','<article class=\"card\"><p class=\"notice\">No account will be created or accessed in this preview.</p><a class=\"btn secondary\" href=\"#/home\">Return home</a></article>')}
function authFlight(){return '<section class="plane-stage"><div class="plane-wrap"><div class="plane-line"><span class="plane">'+icon('plane')+'</span></div><h1>Preparing your '+city+' trip view</h1><p>Applying the destination theme across the whole experience.</p></div></section>'}
function signup(){return shell('Account setup unavailable','Authentication is not connected. Do not enter real personal data or credentials.','<article class=\"card\"><p class=\"notice\">Registration, password sign-in and Google sign-in are not implemented.</p><a class=\"btn secondary\" href=\"#/home\">Return home</a></article>')}
function roleSelect(){return '<section class="auth-wrap"><div class="auth-card"><h1>Choose your account type</h1><p>Google sign-in is a frontend preview. Choose a role to continue without connecting an account.</p><a class="card flat role-card" href="#/journey-search"><strong>Tourist</strong><span>Plan a trip and connect with a guide</span></a><a class="card flat role-card" href="#/guide-details"><strong>Guide</strong><span>Create a guide profile and enter verification</span></a><a class="card flat role-card" href="#/gov-signin"><strong>Government</strong><span>Open the tourism data dashboard</span></a><a class="card flat role-card" href="#/admin-dashboard"><strong>Admin</strong><span>Open KYC, booking and dispute operations</span></a><a class="btn secondary" href="#/signup">Back to Create Account</a></div></section>'}
function touristDetails(){return '<section class="auth-wrap"><form class="auth-card" action="#/journey-search"><h1>Tell us the trip basics</h1><p>These fields are for this session only and are not stored.</p><div class="form-grid"><div class="field"><label>Name</label><input id="touristName" required></div><div class="field"><label>Email</label><input required type="email"></div><div class="field"><label>Phone</label><input required type="tel"></div><div class="field"><label>Age</label><input required type="number" min="18"></div><div class="field"><label>Birth date</label><input required type="date"></div><div class="field"><label>Recent travels</label><input placeholder="Cities or regions"></div></div><button class="btn coral" type="submit">Continue to tourist dashboard '+icon('arrow')+'</button></form></section>'}
function chooseTrip(){var p={Kashmir:4,Goa:3,Hyderabad:4,Visakhapatnam:3};return '<section class="auth-wrap"><div class="auth-card"><h1>What is your next trip?</h1><p>Choose a city to set the full-page photo, accent and weather treatment.</p><div class="choice-grid">'+Object.keys(p).map(function(c){return '<a class="card choice" href="#/tourist-dashboard" data-city="'+c+'"><img src="'+photo(c,p[c])+'" alt="View of '+c+'"><span>'+c+'</span></a>'}).join('')+'</div></div></section>'}
function guideDetails(){return '<section class="auth-wrap"><form class="auth-card" action="#/guide-verification"><h1>Create your guide profile</h1><p>Provide the basics, then continue to verification.</p><div class="form-grid"><div class="field"><label>Name</label><input required></div><div class="field"><label>Phone</label><input required type="tel"></div><div class="field"><label>City</label><select><option>Visakhapatnam</option><option>Vizianagaram</option><option>Bangalore</option><option>Goa</option></select></div><div class="field"><label>Years guiding</label><input required type="number" min="0"></div></div><div class="field"><label>City knowledge</label><input type="range" min="1" max="5" value="4"></div><div class="field"><label>Languages</label><input value="English, Telugu, Hindi"></div><button class="btn coral" type="submit">Continue to verification</button></form></section>'}
function verification(){return shell('Guide verification preview','Identity verification is not available. No documents are collected or checked.','<article class="card"><p class="notice">No verification provider is connected. Do not upload identity documents.</p><a class="btn secondary" href="#/guide-dashboard">Back to guide preview</a></article>')}
function govSignin(){return shell('Government dashboard preview','This screen is a visual demo. No government account or access control is connected.','<article class="card"><p class="notice">Dashboard content is sample data and must not be used for official decisions.</p><a class="btn secondary" href="#/home">Return home</a></article>')}
function locationOptions(selected){return ['Visakhapatnam','Hyderabad','Vijayawada','Chennai','Bengaluru','Goa'].map(function(v){return '<option'+(v===selected?' selected':'')+'>'+v+'</option>'}).join('')}
function formatJourneyDate(){if(!journey.date)return 'Choose a date';var d=new Date(journey.date+'T12:00:00');return isNaN(d)?esc(journey.date):d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function journeySearch(){return shell('Where are you going?','Choose your starting city, destination and travel date. The example route is Visakhapatnam to Hyderabad.','<div class="notice mock-banner"><div><strong>Backend planner integration</strong><br><span>Searches use the route planner API. Fares and schedules are simulated; live seat inventory and booking are not available.</span></div><span class="tag accent">SIMULATED DATA</span></div><form id="journeyForm" class="card journey-form"><div class="field"><label for="journeyFrom">From</label><select id="journeyFrom">'+locationOptions(journey.from)+'</select></div><button class="btn secondary swap-route" id="swapRoute" type="button" aria-label="Swap From and To">⇄</button><div class="field"><label for="journeyTo">To</label><select id="journeyTo">'+locationOptions(journey.to)+'</select></div><div class="field"><label for="journeyDate">Travel date</label><input id="journeyDate" type="date" required value="'+esc(journey.date)+'"></div><div class="field"><label for="journeyMode">Show</label><select id="journeyMode"><option value="all"'+(journey.mode==='all'?' selected':'')+'>Trains and buses</option><option value="train"'+(journey.mode==='train'?' selected':'')+'>Trains only</option><option value="bus"'+(journey.mode==='bus'?' selected':'')+'>Buses only</option></select></div><button class="btn coral" type="submit">Search routes</button></form><div class="grid two" style="margin-top:20px"><article class="card"><span class="tag">Example route</span><h2 style="margin-top:14px">Visakhapatnam → Hyderabad</h2><p>Use this preselected route, choose a date, then compare train and bus cards.</p></article><article class="card"><span class="tag">Planner API</span><h2 style="margin-top:14px">Route planning</h2><p>The planner returns feasible routes, computed fares, timing and risk labels from the backend dataset.</p></article></div>')}
function transportOptions(){var items=plannerOptionsData.filter(function(o){return journey.mode==='all'||o.modes.indexOf(journey.mode)>=0});return shell('Choose a train or bus',journey.from+' to '+journey.to+' · '+formatJourneyDate(),'<div class="notice mock-banner"><div><strong>Rail schedules are live when available</strong><br><span>Train timetables and available running status come from RailRadar. City searches use one main station code. Bus routes and fares remain simulated. RailRadar does not provide fare, seat inventory or booking.</span></div><a class="btn secondary small" href="#/journey-search">Edit route</a></div>'+ (railradarError?'<p class="error" role="status">Live train data unavailable: '+esc(railradarError)+'</p>':'') +'<div class="grid two">'+(items.length?items.map(function(o){return '<article class="card transport-card"><div class="transport-top"><div><span class="tag accent">'+o.kind+'</span><h2 style="margin-top:12px">'+o.name+'</h2><p>'+o.className+'</p></div><span class="tag">'+(o.isLive?(o.delayMinutes==null?'RAILRADAR SCHEDULE':'RAILRADAR LIVE STATUS'):'SIMULATED')+'</span></div><div class="transport-time"><div><strong>'+o.depart+'</strong><small style="display:block;color:var(--muted)">'+journey.from+'</small></div><span class="route-line" aria-hidden="true"></span><div><strong>'+o.arrive+'</strong><small style="display:block;color:var(--muted)">'+journey.to+'</small></div></div><div class="transport-meta"><div><small>Duration</small><strong>'+o.duration+'</strong></div><div><small>Fare</small><strong>'+(o.fare==null?'Not supplied':'₹'+o.fare.toLocaleString('en-IN'))+'</strong></div><div><small>Seat inventory</small><strong>'+o.seats+'</strong></div></div>'+(o.isLive?'<span class="tag">Booking unavailable</span>':'<button class="btn '+(o.kind==='Bus'?'secondary':'')+'" type="button" data-transport="'+o.id+'">Preview journey</button>')+'</article>'}).join(''):'<article class="card"><p>No route options were returned for this search.</p></article>')+'</div>')}
function selectedTransport(){return plannerOptionsData.filter(function(o){return transportChoice&&o.id===transportChoice.id})[0]||plannerOptionsData[0]}
function transportBooking(){var o=selectedTransport();return shell('Passenger details','Continue with the selected planner '+o.kind.toLowerCase()+' option. Nothing is booked or sent.','<div class="grid two"><article class="card"><span class="tag accent">Selected planner option</span><h2 style="margin-top:14px">'+o.name+'</h2><div class="booking-summary"><div class="list-row"><span>Route</span><strong>'+journey.from+' → '+journey.to+'</strong></div><div class="list-row"><span>Date</span><strong>'+formatJourneyDate()+'</strong></div><div class="list-row"><span>Time</span><strong>'+o.depart+' → '+o.arrive+'</strong></div><div class="list-row"><span>Sample fare</span><strong>'+(o.fare==null?'Not supplied':'₹'+o.fare.toLocaleString('en-IN'))+'</strong></div></div></article><form class="card" action="#/transport-review"><h2>Traveler information</h2><p style="margin-bottom:18px">Session-only fields for the frontend flow.</p><div class="field"><label for="passengerName">Lead passenger</label><input id="passengerName" required autocomplete="name" value="'+(userName==='Traveler'?'':esc(userName))+'"></div><div class="form-grid"><div class="field"><label for="passengerCount">Passengers</label><select id="passengerCount"><option>1</option><option>2</option><option>3</option><option>4</option></select></div><div class="field"><label for="seatPreference">Seat preference</label><select id="seatPreference"><option>No preference</option><option>Window</option><option>Aisle</option><option>Lower berth</option></select></div></div><button class="btn coral" type="submit">Review booking preview</button></form></div>')}
function transportReview(){var o=selectedTransport();return shell('Review before API handoff','This is not a booking confirmation. It is the final frontend state for your team to connect to a booking API.','<div class="grid two"><article class="card"><span class="tag">NOT BOOKED</span><h2 style="margin-top:14px">'+o.name+'</h2><div class="list" style="margin-top:18px"><div class="list-row"><span>Route</span><strong>'+journey.from+' → '+journey.to+'</strong></div><div class="list-row"><span>Travel date</span><strong>'+formatJourneyDate()+'</strong></div><div class="list-row"><span>Departure</span><strong>'+o.depart+'</strong></div><div class="list-row"><span>Sample fare</span><strong>'+(o.fare==null?'Not supplied':'₹'+o.fare.toLocaleString('en-IN'))+'</strong></div></div></article><article class="card"><h2>Backend connection point</h2><p>Send the selected option ID, route, date and passenger payload to your booking API. The production response should replace this panel with a real reference and verified status.</p><div class="action-row"><a class="btn" href="#/tourist-dashboard">Return to dashboard</a><a class="btn secondary" href="#/transport-options">Choose another option</a></div></article></div>')}
function shell(t,s,b,x){return '<section class="app-page"><div class="app-shell"><div class="page-head"><div><p class="eyebrow">'+city+' trip</p><h1>'+t+'</h1><p>'+s+'</p></div>'+(x||'')+'</div>'+b+'</div></section>'}
function dashboard(){var p={Kashmir:['Baisaran','Dal Lake','Mughal Gardens'],Goa:['Aguada Beach','Calangute Beach','Fontainhas'],Hyderabad:['Charminar','Golconda Fort','Hussain Sagar'],Visakhapatnam:['Dolphin Park','Rushikonda Beach','Kailasagiri']}[city];return shell('Good to see you, '+esc(userName),'Your next steps for a '+city+' trip are in one place.','<div class="grid three"><div class="metric"><strong>3 days</strong><span>Demo itinerary length</span></div><div class="metric"><strong>Guide choice</strong><span>Online or offline support</span></div><div class="metric"><strong>Demo booking flow</strong><span>Booking and payment are not connected</span></div></div><article class="card" style="margin-top:20px"><div class="transport-top"><div><span class="tag accent">Train &amp; bus</span><h2 style="margin-top:12px">'+journey.from+' → '+journey.to+'</h2><p>Choose a date, compare clearly marked mock options, and walk through the passenger booking flow.</p></div><a class="btn coral" href="#/journey-search">Plan journey</a></div></article><div class="grid two" style="margin-top:20px"><article class="card"><h2>AI itinerary preview</h2><div class="timeline" style="margin-top:18px">'+p.map(function(v,i){return '<div class="timeline-item"><div><h3>Day '+(i+1)+': '+v+'</h3><p>Review pace, transport and guide support.</p></div></div>'}).join('')+'</div><a class="btn" href="#/itinerary">Open full itinerary</a></article><article class="card"><h2>Booking preview</h2><p>No booking or payment provider is connected.</p><div class="list" style="margin-top:18px"><div class="list-row"><span>Payment unavailable</span><span class="tag accent">Step 1</span></div><div class="list-row"><span>No balance held</span><span class="tag">Step 2</span></div><div class="list-row"><span>No payment release</span><span class="tag">Step 3</span></div></div><a class="btn secondary" href="#/booking" style="margin-top:18px">Review booking flow</a></article></div>')}
function itinerary(){var l={Kashmir:[['Baisaran','Walk and local orientation'],['Dal Lake','Lakefront route and old city'],['Mughal Gardens','Gardens and relaxed return']],Goa:[['Aguada Beach','Coastal start and fort area'],['Calangute Beach','Beach route and local streets'],['Fontainhas','Heritage quarter and culture']],Hyderabad:[['Charminar','Old city landmarks'],['Golconda Fort','Fort route and evening view'],['Hussain Sagar','Lakefront and city close']],Visakhapatnam:[['Dolphin Park','Coastal viewpoint route'],['Rushikonda Beach','Beach and nearby stops'],['Kailasagiri','Hill park and city view']]}[city];return shell('Your three-day itinerary','A clear structure you can review before choosing a guide.','<div class="grid three">'+l.map(function(d,i){return '<article class="card"><span class="tag accent">Day '+(i+1)+'</span><h2 style="margin-top:16px">'+d[0]+'</h2><p>'+d[1]+'. Confirm opening hours and transport before travel.</p><a class="btn secondary" href="#/guides" style="margin-top:18px">Find a guide</a></article>'}).join('')+'</div><div class="action-row"><a class="btn" href="#/booking">Continue to booking</a><a class="btn secondary" href="#/tourist-dashboard">Back to dashboard</a></div>')}
function guidesPage(){return shell('Sample guide profiles','Compare support mode, languages and city expertise. No reviews or ratings are shown.','<div class="grid four">'+guides.map(function(g,i){return '<article class="card guide-card">'+avatar()+'<div><h2>'+g.name+'</h2><p>'+g.city+'</p></div><div><span class="tag">'+g.expertise+' expertise · sample profile</span></div><p>English, Telugu, Hindi</p><div class="guide-prices"><div class="price-line"><small>Online</small><strong>Rs '+g.online+'/day</strong></div><div class="price-line"><small>Offline</small><strong>Rs '+g.offline+'/day</strong></div></div><div class="action-row"><a class="btn secondary small" href="#/guide-profile?g='+i+'">Profile</a><a class="btn small" href="#/connect?g='+i+'">Connect</a></div></article>'}).join('')+'</div>')}
function getGuide(){var m=location.hash.match(/[?&]g=(\d+)/);return guides[m?Math.min(3,Number(m[1])):0]}
function guideProfileTourist(){var g=getGuide();return shell(g.name+' in '+g.city,'Guide profile with language, expertise and support pricing.','<div class="grid two"><article class="card"><div class="guide-top">'+avatar()+'<div><h2>'+g.name+'</h2><p>'+g.city+'</p></div></div><div class="list" style="margin-top:20px"><div class="list-row"><span>Expertise</span><strong>'+g.expertise+'</strong></div><div class="list-row"><span>Languages</span><strong>English, Telugu, Hindi</strong></div><div class="list-row"><span>Online support</span><strong>Rs '+g.online+'/day</strong></div><div class="list-row"><span>Offline support</span><strong>Rs '+g.offline+'/day</strong></div></div></article><article class="card"><h2>Support modes</h2><p><strong>Online:</strong> remote chat or call support during planning and travel.</p><p style="margin-top:12px"><strong>Offline:</strong> physical guide support in the destination.</p><a class="btn coral" href="#/connect?g='+guides.indexOf(g)+'" style="margin-top:20px">View match breakdown</a></article></div>')}

function booking(){return shell('Booking preview','This prototype does not create a reservation or payment.','<article class=\"card\"><h2>Booking is unavailable</h2><p class=\"notice\">No booking provider, guide assignment or payment processor is connected.</p><a class=\"btn secondary\" href=\"#/journey-search\">Back to trip planning</a></article>')}

function activeTrip(){return shell('Active trip','No live tracking, guide chat, check-ins or safety service is connected.','<div class="grid two"><div class="map-status"><div><span class="tag accent">Route status</span><h2>'+city+' day 1</h2></div><div class="pulse" aria-hidden="true"></div><div><strong>Current leg: city orientation</strong><p>Live map rendering is not connected in this frontend demo.</p></div></div><article class="card"><h2>Trip controls</h2><div class="list"><div class="list-row"><div><h3>Check-in</h3><p>Mark the current stop as reached</p></div><a class="btn small" href="#/trip-chat">Check in</a></div><div class="list-row"><div><h3>Guide chat</h3><p>Open the trip conversation</p></div><a class="btn secondary small" href="#/trip-chat">Open chat</a></div></div><a class="btn sos" href="#/sos" style="margin-top:20px">Open SOS page</a></article></div>')}

function sos(){return shell('SOS assistance','Emergency actions are visual only in this frontend demo.','<div class="sos-panel"><h2>If you are in immediate danger</h2><p>Use your phone to contact local emergency services. This demo does not place calls or share a live location.</p><div class="action-row"><a class="btn sos" href="#/active-trip">Return to trip status</a><a class="btn secondary" href="#/trip-chat">Message guide</a></div></div>')}
function review(){return shell('Trip feedback','Complete the feedback structure after the trip. No sample reviews are displayed.','<form class="card" action="#/trip-history"><div class="field"><label>What went well?</label><textarea></textarea></div><div class="field"><label>What should improve?</label><textarea></textarea></div><div class="field"><label>Would you use the same guide mode again?</label><select><option>Select an answer</option><option>Yes</option><option>No</option><option>Not sure</option></select></div><button class="btn" type="submit">Continue to trip history</button></form>')}

function makeChart(d,max,label){var W=720,H=260,L=132,R=54,T=18,B=34,PW=W-L-R,PH=H-T-B;var bars=d.map(function(x,i){var y=T+i*(PH/d.length)+7,h=26,w=x[1]/max*PW;return '<text x="0" y="'+(y+18)+'">'+x[0]+'</text><rect class="bar" x="'+L+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4"></rect><text x="'+(L+w+8)+'" y="'+(y+18)+'">'+x[1].toFixed(2)+'</text>'}).join('');var ticks=[0,.25,.5,.75,1].map(function(t){var x=L+t*PW;return '<line class="axis" x1="'+x+'" y1="'+T+'" x2="'+x+'" y2="'+(H-B)+'"></line><text x="'+x+'" y="'+(H-8)+'" text-anchor="middle">'+(max*t).toFixed(max>100?0:1)+'</text>'}).join('');return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+'">'+ticks+bars+'</svg>'}
