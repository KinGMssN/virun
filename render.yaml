services:
  - type: web
    name: virun
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: RAILRADAR_API_KEY
        sync: false
      - key: TRANSPORT_REPOSITORY
        value: json
